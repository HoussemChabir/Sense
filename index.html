<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a52835" />
    <!-- Each page's title, description, canonical, share tags and structured data are added from src/templates.js. -->
    <!-- Google shows a square favicon that is a multiple of 48px: the 48px one in favicon.ico, or the 192px one. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" type="image/avif" href="/src/assets/watercolor-edge-mobile-2x.avif" media="(max-width: 700px) and (max-resolution: 2dppx)" />
    <link rel="preload" as="image" type="image/avif" href="/src/assets/watercolor-edge-mobile.avif" media="(max-width: 700px) and (min-resolution: 2.01dppx)" />
    <link rel="preload" href="/assets/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Linked here, not imported from main.js, so the loading screen is styled before any script runs. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The page itself, from src/templates.js: the loading screen (home page only), skip link, page and WhatsApp button. -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
